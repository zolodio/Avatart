<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELEMENTS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#030508}
canvas{position:fixed;inset:0;display:block;cursor:none;touch-action:none}

#xc{
  position:fixed;width:18px;height:18px;border-radius:50%;
  border:1.5px solid #ff6b3d;box-shadow:0 0 8px #ff6b3d99;
  transform:translate(-50%,-50%);pointer-events:none;
  transition:border-color .35s,box-shadow .35s;z-index:100;
}

#bar{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;
  background:rgba(4,6,12,.82);border:1px solid rgba(255,255,255,.07);
  border-radius:99px;padding:7px 10px;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 16px 48px rgba(0,0,0,.7);z-index:50;
}
.eb{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 16px;border-radius:99px;border:1px solid transparent;
  background:transparent;cursor:pointer;transition:all .22s;
  color:rgba(255,255,255,.22);font-family:'Cinzel',serif;
  font-size:.46rem;font-weight:700;text-transform:uppercase;letter-spacing:.16em;
  white-space:nowrap;line-height:1;
}
.eb .em{font-size:.95rem;display:block;margin-bottom:3px;line-height:1}
.eb:hover{color:rgba(255,255,255,.6);background:rgba(255,255,255,.04)}
.eb.on{color:#fff}
.eb.on[data-e=fire]  {background:rgba(232,83,46,.2);border-color:rgba(255,107,61,.45);box-shadow:0 0 14px rgba(232,83,46,.3)}
.eb.on[data-e=water] {background:rgba(46,140,232,.2);border-color:rgba(61,165,255,.45);box-shadow:0 0 14px rgba(46,140,232,.3)}
.eb.on[data-e=earth] {background:rgba(92,184,92,.2);border-color:rgba(111,216,111,.45);box-shadow:0 0 14px rgba(92,184,92,.3)}
.eb.on[data-e=air]   {background:rgba(240,201,70,.2);border-color:rgba(255,217,102,.45);box-shadow:0 0 14px rgba(240,201,70,.3)}
.eb.on[data-e=spirit]{background:rgba(180,77,223,.2);border-color:rgba(209,107,255,.45);box-shadow:0 0 14px rgba(180,77,223,.3)}
.eb.on[data-e=lightning]{background:rgba(255,200,87,.2);border-color:rgba(255,223,119,.45);box-shadow:0 0 14px rgba(255,200,87,.3)}

.bdiv{width:1px;height:26px;background:rgba(255,255,255,.07);margin:0 2px;flex-shrink:0}

#bclear{
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(255,255,255,.09);background:transparent;
  cursor:pointer;color:rgba(255,255,255,.22);font-size:.75rem;
  font-family:'Cinzel',serif;transition:all .2s;flex-shrink:0;
}
#bclear:hover{color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.05)}

#hint{
  position:fixed;top:26px;width:100%;text-align:center;
  color:rgba(255,255,255,.13);font-family:'Cinzel',serif;
  font-size:.56rem;letter-spacing:.32em;text-transform:uppercase;
  pointer-events:none;transition:opacity 2s ease;z-index:50;
}
#keys{
  position:fixed;bottom:84px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.06);font-family:'Cinzel',serif;
  font-size:.44rem;letter-spacing:.18em;text-transform:uppercase;
  pointer-events:none;white-space:nowrap;z-index:50;
}
#wm{
  position:fixed;top:22px;right:28px;
  color:rgba(255,255,255,.05);font-family:'Cinzel',serif;
  font-size:.68rem;font-weight:900;letter-spacing:.45em;text-transform:uppercase;
  pointer-events:none;z-index:50;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="xc"></div>
<div id="hint">Click &amp; drag to paint · double-click to burst</div>
<div id="keys">1-6 to switch · C to clear</div>
<div id="wm">Elements</div>

<div id="bar">
  <button class="eb on" data-e="fire">  <span class="em">🔥</span>Fire</button>
  <button class="eb"    data-e="water"> <span class="em">💧</span>Water</button>
  <button class="eb"    data-e="earth"> <span class="em">🪨</span>Earth</button>
  <button class="eb"    data-e="air">   <span class="em">🌬️</span>Air</button>
  <button class="eb"    data-e="spirit"><span class="em">✨</span>Spirit</button>
  <button class="eb"    data-e="lightning"><span class="em">⚡</span>Lightning</button>
  <div class="bdiv"></div>
  <button id="bclear" title="Clear (C)">✕</button>
</div>

<script>
!function(){
'use strict';

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const xc=document.getElementById('xc');
const hint=document.getElementById('hint');

let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();
addEventListener('resize',resize);

let el='fire',tick=0,mx=0,my=0,pmx=0,pmy=0,mdown=false,hinted=false;
let parts=[];
const MAX=2400;
let activeTouches=new Map();

/* ──────────────────────────────────────────────────────────────────
   PALETTES
   Each entry: [ratio, [r,g,b,a]]  where ratio: 0=dead, 1=newborn
────────────────────────────────────────────────────────────────── */
const PAL={
  fire:[
    [0,   [85,  6,   0,   0   ]],
    [0.1, [180, 22,  0,   0.2 ]],
    [0.3, [255, 68,  4,   0.88]],
    [0.6, [255, 158, 18,  1   ]],
    [0.82,[255, 218, 72,  1   ]],
    [1,   [255, 248, 200, 1   ]],
  ],
  water:[
    [0,   [4,   22,  75,  0   ]],
    [0.18,[16,  70,  155, 0.38]],
    [0.45,[46,  140, 232, 0.82]],
    [0.72,[70,  192, 255, 1   ]],
    [1,   [190, 232, 255, 1   ]],
  ],
  earth:[
    [0,   [10,  28,  6,   0   ]],
    [0.18,[25,  55,  18,  0.52]],
    [0.45,[55,  120, 44,  0.88]],
    [0.72,[92,  184, 72,  1   ]],
    [1,   [178, 232, 138, 1   ]],
  ],
  air:[
    [0,   [200, 175, 50,  0   ]],
    [0.12,[238, 208, 80,  0.08]],
    [0.38,[252, 232, 148, 0.24]],
    [0.65,[255, 248, 208, 0.42]],
    [1,   [255, 255, 255, 0.48]],
  ],
  spirit:[
    [0,   [45,  0,   72,  0   ]],
    [0.14,[105, 15,  148, 0.28]],
    [0.38,[172, 50,  220, 0.86]],
    [0.68,[212, 130, 252, 1   ]],
    [1,   [248, 222, 255, 1   ]],
  ],
  lightning:[
    [0,   [200, 180, 0,   0   ]],
    [0.08,[255, 240, 100, 0.4 ]],
    [0.25,[255, 255, 180, 0.9 ]],
    [0.5, [255, 255, 220, 1   ]],
    [0.7, [220, 200, 100, 1   ]],
    [1,   [100, 80,  0,   0   ]],
  ],
};

function getCol(e,r){
  const kf=PAL[e];
  for(let i=1;i<kf.length;i++){
    if(r<=kf[i][0]||i===kf.length-1){
      const lo=kf[i-1],hi=kf[i];
      const f=hi[0]===lo[0]?1:(r-lo[0])/(hi[0]-lo[0]);
      const v=lo[1].map((a,j)=>j<3
        ? Math.round(a+(hi[1][j]-a)*f)
        : +(a+(hi[1][j]-a)*f).toFixed(3)
      );
      return`rgba(${v[0]},${v[1]},${v[2]},${v[3]})`;
    }
  }
  const l=kf[kf.length-1][1];
  return`rgba(${l[0]},${l[1]},${l[2]},${l[3]})`;
}

const GLOW ={fire:'#ff6b3d',water:'#3da5ff',earth:null,   air:null,   spirit:'#d16bff',lightning:'#ffdc57'};
const GMULT={fire:3.5,      water:2.8,      earth:0,      air:0,      spirit:5.5,     lightning:6.2 };

/* ──────────────────────────────────────────────────────────────────
   PARTICLE
────────────────────────────────────────────────────────────────── */
class P{
  constructor(x,y,e,vx=0,vy=0){
    this.x=x;this.y=y;this.e=e;
    switch(e){
      case'fire':
        // Burst upward with horizontal chaos
        this.vx=(Math.random()-.5)*6;
        this.vy=-(Math.random()*5+2.5);
        this.ml=50+Math.random()*80;
        this.sz=Math.random()*3.5+.8;
        break;
      case'water':{
        // Gentle random direction
        const a=Math.random()*Math.PI*2,s=Math.random()*2.5+.3;
        this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
        this.ml=145+Math.random()*145;
        this.sz=Math.random()*2.5+.8;
        this.ph=Math.random()*Math.PI*2;
        break;
      }
      case'earth':
        // Inherit drag momentum + scatter
        this.vx=vx+(Math.random()-.5)*3.5;
        this.vy=vy+(Math.random()-.5)*2;
        this.ml=200+Math.random()*200;
        this.sz=Math.random()*5+2.5;
        this.bounce=true;
        break;
      case'air':{
        // Drifting outward
        const a=Math.random()*Math.PI*2,s=Math.random()*3+.5;
        this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
        this.ml=260+Math.random()*280;
        this.sz=Math.random()*2+.4;
        this.rd=Math.random()>.5?1:-1;
        break;
      }
      case'spirit':{
        // Explosive radial burst
        const a=Math.random()*Math.PI*2,s=Math.random()*5.5+2;
        this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
        this.ml=80+Math.random()*115;
        this.sz=Math.random()*4+1.5;
        this.ox=x;this.oy=y;
        break;
      }
      case'lightning':{
        // Fast branching burst
        const a=Math.random()*Math.PI*2,s=Math.random()*8+4;
        this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
        this.ml=35+Math.random()*55;
        this.sz=Math.random()*3.5+1;
        this.branch=0;
        break;
      }
    }
    this.l=this.ml;
  }

  step(){
    switch(this.e){
      case'fire':
        // Chaotic turbulence, natural upward float
        this.vx+=(Math.random()-.5)*.58;
        this.vy-=.09;
        this.vx*=.965;this.vy*=.98;
        break;
      case'water':
        // Sinusoidal oscillation, very slight gravity
        this.vx+=Math.sin(tick*.033+this.ph)*.072;
        this.vy+=.023;
        this.vx*=.993;this.vy*=.993;
        break;
      case'earth':
        // Heavy gravity with realistic bounce
        this.vy+=.32;
        if(this.y>=H-this.sz&&this.vy>0&&this.bounce){
          this.vy*=-.28;this.vx*=.58;this.y=H-this.sz;
        }
        if(this.y>=H-this.sz)this.bounce=false;
        this.vx*=.955;
        break;
      case'air':{
        // Spiral by rotating velocity vector each frame
        const co=Math.cos(.023*this.rd),si=Math.sin(.023*this.rd);
        const nvx=this.vx*co-this.vy*si;
        this.vy=this.vx*si+this.vy*co;
        this.vx=nvx;
        this.vx*=.9986;this.vy*=.9986;
        this.vy-=.007; // barely-there lift
        break;
      }
      case'spirit':
        // Burst outward, pulled home in second half of life
        if(this.l/this.ml<.5){
          this.vx+=(this.ox-this.x)*.006;
          this.vy+=(this.oy-this.y)*.006;
        }
        this.vx*=.96;this.vy*=.96;
        break;
      case'lightning':
        // Branch occasionally, fast decay
        this.vx*=.92;this.vy*=.92;
        this.vy+=.08; // slight gravity
        if(this.branch<2&&Math.random()<.08){
          this.branch++;
          // Create secondary branches
          for(let i=0;i<2;i++){
            if(parts.length<MAX){
              const ang=Math.atan2(this.vy,this.vx)+(Math.random()-.5)*1.2;
              const sp=Math.hypot(this.vx,this.vy)*.6;
              parts.push(new P(this.x,this.y,'lightning',Math.cos(ang)*sp,Math.sin(ang)*sp));
            }
          }
        }
        break;
    }
    this.x+=this.vx;
    this.y+=this.vy;
    this.l--;
  }

  draw(){
    const r=this.l/this.ml;
    if(r<=0)return;
    const sz=this.sz*Math.min(r*2.8,1);
    if(sz<.18)return;

    // Soft glow halo (cheaper than shadowBlur, looks great)
    const g=GLOW[this.e];
    if(g&&r>.14){
      ctx.globalAlpha=r*.22;
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.arc(this.x,this.y,sz*GMULT[this.e],0,6.283);
      ctx.fill();
    }

    // Core particle
    ctx.globalAlpha=1;
    ctx.fillStyle=getCol(this.e,r);
    ctx.beginPath();
    ctx.arc(this.x,this.y,Math.max(sz,.28),0,6.283);
    ctx.fill();
  }

  get dead(){return this.l<=0}
}

/* ──────────────────────────────────────────────────────────────────
   SPAWN CONFIG
────────────────────────────────────────────────────────────────── */
const SPAWN_N={fire:10,water:8, earth:5, air:16,spirit:8, lightning:12 };
const SPAWN_R={fire:9, water:14,earth:11,air:20,spirit:13,lightning:16 };

function spawn(x,y,mult=1,dragVx=0,dragVy=0){
  const n=Math.ceil(SPAWN_N[el]*mult);
  const r=SPAWN_R[el];
  for(let i=0;i<n&&parts.length<MAX;i++){
    parts.push(new P(
      x+(Math.random()-.5)*r*2,
      y+(Math.random()-.5)*r*2,
      el,
      dragVx,dragVy
    ));
  }
}

/* ──────────────────────────────────────────────────────────────────
   RENDER LOOP
────────────────────────────────────────────────────────────────── */
// Fill initial black
ctx.fillStyle='#030508';
ctx.fillRect(0,0,W,H);

function frame(){
  tick++;

  // Trail fade — lower alpha = longer trails
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(3,5,8,.13)';
  ctx.fillRect(0,0,W,H);

  // Update and draw; filter dead particles
  const live=[];
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    p.step();
    if(!p.dead){p.draw();live.push(p)}
  }
  parts=live;

  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ──────────────────────────────────────────────────────────────────
   INPUT
────────────────────────────────────────────────────────────────── */
function move(x,y){
  pmx=mx;pmy=my;
  mx=x;my=y;
  xc.style.left=x+'px';
  xc.style.top=y+'px';
  if(!hinted){hinted=true;hint.style.opacity='0'}
}

function getDragVelocity(){
  const dvx=(mx-pmx)*.12;
  const dvy=(my-pmy)*.12;
  return {dvx,dvy};
}

canvas.addEventListener('mousemove',e=>{
  move(e.clientX,e.clientY);
  if(mdown){
    const {dvx,dvy}=getDragVelocity();
    spawn(e.clientX,e.clientY,1,dvx,dvy);
  }
});
canvas.addEventListener('mousedown', e=>{
  mdown=true;
  pmx=e.clientX;pmy=e.clientY;
  spawn(e.clientX,e.clientY);
});
canvas.addEventListener('mouseup',  ()=>mdown=false);
canvas.addEventListener('mouseleave',()=>mdown=false);
canvas.addEventListener('dblclick', e=>{
  // Satisfying burst on double-click
  for(let i=0;i<5;i++)spawn(e.clientX,e.clientY,1.6);
});

// Multi-touch support
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  for(let i=0;i<e.touches.length;i++){
    const t=e.touches[i];
    const id=t.identifier;
    activeTouches.set(id,{x:t.clientX,y:t.clientY,px:t.clientX,py:t.clientY});
    move(t.clientX,t.clientY);
    spawn(t.clientX,t.clientY);
  }
},{passive:false});

canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(let i=0;i<e.touches.length;i++){
    const t=e.touches[i];
    const id=t.identifier;
    if(activeTouches.has(id)){
      const touch=activeTouches.get(id);
      const dvx=(t.clientX-touch.px)*.12;
      const dvy=(t.clientY-touch.py)*.12;
      touch.px=t.clientX;
      touch.py=t.clientY;
      move(t.clientX,t.clientY);
      spawn(t.clientX,t.clientY,1,dvx,dvy);
    }
  }
},{passive:false});

canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    const id=e.changedTouches[i].identifier;
    activeTouches.delete(id);
  }
},{passive:false});

canvas.addEventListener('touchcancel', e=>{
  activeTouches.clear();
});

/* ──────────────────────────────────────────────────────────────────
   UI
────────────────────────────────────────────────────────────────── */
const GLC={
  fire:'#ff6b3d',water:'#3da5ff',
  earth:'#6fd86f',air:'#ffd966',spirit:'#d16bff',lightning:'#ffdc57'
};

function setEl(name){
  document.querySelectorAll('.eb').forEach(b=>b.classList.remove('on'));
  document.querySelector(`.eb[data-e="${name}"]`).classList.add('on');
  el=name;
  xc.style.borderColor=GLC[el];
  xc.style.boxShadow=`0 0 9px ${GLC[el]}aa`;
}

document.querySelectorAll('.eb').forEach(b=>{
  b.addEventListener('click',()=>setEl(b.dataset.e));
});

function clearCanvas(){
  parts=[];
  ctx.fillStyle='#030508';
  ctx.fillRect(0,0,W,H);
}
document.getElementById('bclear').addEventListener('click',clearCanvas);

// Keyboard shortcuts
const KEYS={
  Digit1:'fire',Digit2:'water',Digit3:'earth',Digit4:'air',Digit5:'spirit',Digit6:'lightning',
  KeyF:'fire',  KeyW:'water',  KeyE:'earth',  KeyA:'air',  KeyS:'spirit', KeyL:'lightning',
};
addEventListener('keydown',e=>{
  if(KEYS[e.code])setEl(KEYS[e.code]);
  if(e.code==='KeyC')clearCanvas();
});

}();
</script>
</body>
</html>
