<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELEMENTS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#030508}
canvas{position:fixed;inset:0;display:block;cursor:none;touch-action:none}

#xc{
  position:fixed;width:18px;height:18px;border-radius:50%;
  border:1.5px solid #ff6b3d;box-shadow:0 0 8px #ff6b3d99;
  transform:translate(-50%,-50%);pointer-events:none;
  transition:border-color .35s,box-shadow .35s;z-index:100;
}

#bar{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;
  background:rgba(4,6,12,.82);border:1px solid rgba(255,255,255,.07);
  border-radius:99px;padding:7px 10px;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 16px 48px rgba(0,0,0,.7);z-index:50;
  touch-action:auto;overflow-x:auto;
}
.eb{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 16px;border-radius:99px;border:1px solid transparent;
  background:transparent;cursor:pointer;transition:all .22s;
  color:rgba(255,255,255,.22);font-family:'Cinzel',serif;
  font-size:.46rem;font-weight:700;text-transform:uppercase;letter-spacing:.16em;
  white-space:nowrap;line-height:1;
}
.eb .em{font-size:.95rem;display:block;margin-bottom:3px;line-height:1}
.eb:hover{color:rgba(255,255,255,.6);background:rgba(255,255,255,.04)}
.eb.on{color:#fff}
.eb.on[data-e=fire]  {background:rgba(232,83,46,.2);border-color:rgba(255,107,61,.45);box-shadow:0 0 14px rgba(232,83,46,.3)}
.eb.on[data-e=water] {background:rgba(46,140,232,.2);border-color:rgba(61,165,255,.45);box-shadow:0 0 14px rgba(46,140,232,.3)}
.eb.on[data-e=snow]  {background:rgba(150,200,255,.2);border-color:rgba(180,220,255,.45);box-shadow:0 0 14px rgba(150,200,255,.3)}
.eb.on[data-e=earth] {background:rgba(184,132,92,.2);border-color:rgba(220,160,120,.45);box-shadow:0 0 14px rgba(184,132,92,.3)}
.eb.on[data-e=air]   {background:rgba(240,201,70,.2);border-color:rgba(255,217,102,.45);box-shadow:0 0 14px rgba(240,201,70,.3)}
.eb.on[data-e=spirit]{background:rgba(180,77,223,.2);border-color:rgba(209,107,255,.45);box-shadow:0 0 14px rgba(180,77,223,.3)}
.eb.on[data-e=lightning]{background:rgba(255,200,87,.2);border-color:rgba(255,223,119,.45);box-shadow:0 0 14px rgba(255,200,87,.3)}
.eb.on[data-e=crystallize]{background:rgba(100,200,255,.2);border-color:rgba(150,220,255,.45);box-shadow:0 0 14px rgba(100,200,255,.3)}
.eb.on[data-e=bloom] {background:rgba(255,100,200,.2);border-color:rgba(255,150,220,.45);box-shadow:0 0 14px rgba(255,100,200,.3)}
.eb.on[data-e=laser] {background:rgba(100,255,200,.2);border-color:rgba(150,255,220,.45);box-shadow:0 0 14px rgba(100,255,200,.3)}
.eb.on[data-e=vacuum]{background:rgba(60,20,100,.2);border-color:rgba(150,100,200,.45);box-shadow:0 0 14px rgba(100,50,150,.3)}

.bdiv{width:1px;height:26px;background:rgba(255,255,255,.07);margin:0 2px;flex-shrink:0}

#bclear{
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(255,255,255,.09);background:transparent;
  cursor:pointer;color:rgba(255,255,255,.22);font-size:.75rem;
  font-family:'Cinzel',serif;transition:all .2s;flex-shrink:0;
}
#bclear:hover{color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.05)}

#hint{
  position:fixed;top:26px;width:100%;text-align:center;
  color:rgba(255,255,255,.13);font-family:'Cinzel',serif;
  font-size:.56rem;letter-spacing:.32em;text-transform:uppercase;
  pointer-events:none;transition:opacity 2s ease;z-index:50;
}
#keys{
  position:fixed;bottom:84px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.06);font-family:'Cinzel',serif;
  font-size:.44rem;letter-spacing:.18em;text-transform:uppercase;
  pointer-events:none;white-space:nowrap;z-index:50;
}
#wm{
  position:fixed;top:22px;right:28px;
  color:rgba(255,255,255,.05);font-family:'Cinzel',serif;
  font-size:.68rem;font-weight:900;letter-spacing:.45em;text-transform:uppercase;
  pointer-events:none;z-index:50;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="xc"></div>
<div id="hint">Click &amp; drag to paint · double-click to burst</div>
<div id="keys">0-9 to switch · C to clear</div>
<div id="wm">Elements</div>

<div id="bar">
  <button class="eb on" data-e="fire">  <span class="em">🔥</span>Fire</button>
  <button class="eb"    data-e="water"> <span class="em">💧</span>Water</button>
  <button class="eb"    data-e="snow">  <span class="em">❄️</span>Snow</button>
  <button class="eb"    data-e="earth"> <span class="em">🌍</span>Earth</button>
  <button class="eb"    data-e="air">   <span class="em">🌬️</span>Air</button>
  <button class="eb"    data-e="spirit"><span class="em">✨</span>Spirit</button>
  <button class="eb"    data-e="lightning"><span class="em">⚡</span>Lightning</button>
  <button class="eb"    data-e="crystallize"><span class="em">💎</span>Crystallize</button>
  <button class="eb"    data-e="bloom">  <span class="em">🌸</span>Bloom</button>
  <button class="eb"    data-e="laser">  <span class="em">🔫</span>Laser</button>
  <button class="eb"    data-e="vacuum"> <span class="em">🌀</span>Vacuum</button>
  <div class="bdiv"></div>
  <button id="bclear" title="Clear (C)">✕</button>
</div>

<script>
!function(){
'use strict';

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const xc=document.getElementById('xc');
const hint=document.getElementById('hint');

let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();
addEventListener('resize',resize);

let el='fire',tick=0,mx=0,my=0,pmx=0,pmy=0,mdown=false,hinted=false;
let parts=[];
const MAX=2400;
let activeTouches=new Map();
let chargeStart=0,chargeTime=0;
let touchCharges=new Map(); // Track charge time per touch ID
let laserStart={x:0,y:0},laserEnd={x:0,y:0},laserActive=false;

/* ──────────────────────────────────────────────────────────────────
   PALETTES
   Each entry: [ratio, [r,g,b,a]]  where ratio: 0=dead, 1=newborn
────────────────────────────────────────────────────────────────── */
const PAL={
  fire:[
    [0,   [85,  6,   0,   0   ]],
    [0.1, [180, 22,  0,   0.2 ]],
    [0.3, [255, 68,  4,   0.88]],
    [0.6, [255, 158, 18,  1   ]],
    [0.82,[255, 218, 72,  1   ]],
    [1,   [255, 248, 200, 1   ]],
  ],
  water:[
    [0,   [4,   22,  75,  0   ]],
    [0.18,[16,  70,  155, 0.38]],
    [0.45,[46,  140, 232, 0.82]],
    [0.72,[70,  192, 255, 1   ]],
    [1,   [190, 232, 255, 1   ]],
  ],
  snow:[
    [0,   [180, 210, 255, 0   ]],
    [0.15,[200, 230, 255, 0.25]],
    [0.45,[220, 240, 255, 0.7 ]],
    [0.72,[240, 248, 255, 1   ]],
    [1,   [255, 255, 255, 1   ]],
  ],
  earth:[
    [0,   [60,  40,  20,  0   ]],
    [0.18,[140, 85,  55,  0.6 ]],
    [0.45,[200, 130, 80,  0.9 ]],
    [0.72,[220, 160, 110, 1   ]],
    [1,   [240, 180, 130, 1   ]],
  ],
  air:[
    [0,   [200, 175, 50,  0   ]],
    [0.12,[238, 208, 80,  0.08]],
    [0.38,[252, 232, 148, 0.24]],
    [0.65,[255, 248, 208, 0.42]],
    [1,   [255, 255, 255, 0.48]],
  ],
  spirit:[
    [0,   [45,  0,   72,  0   ]],
    [0.14,[105, 15,  148, 0.28]],
    [0.38,[172, 50,  220, 0.86]],
    [0.68,[212, 130, 252, 1   ]],
    [1,   [248, 222, 255, 1   ]],
  ],
  lightning:[
    [0,   [200, 180, 0,   0   ]],
    [0.08,[255, 240, 100, 0.4 ]],
    [0.25,[255, 255, 180, 0.9 ]],
    [0.5, [255, 255, 220, 1   ]],
    [0.7, [220, 200, 100, 1   ]],
    [1,   [100, 80,  0,   0   ]],
  ],
  crystallize:[
    [0,   [100, 200, 255, 0   ]],
    [0.12,[150, 220, 255, 0.3 ]],
    [0.35,[180, 235, 255, 0.7 ]],
    [0.6, [200, 245, 255, 0.95]],
    [0.85,[220, 255, 255, 1   ]],
    [1,   [100, 180, 255, 1   ]],
  ],
  bloom:[
    [0,   [255, 100, 180, 0   ]],
    [0.15,[255, 120, 200, 0.4 ]],
    [0.4, [255, 150, 220, 0.8 ]],
    [0.65,[255, 180, 230, 1   ]],
    [0.85,[255, 200, 240, 1   ]],
    [1,   [255, 220, 245, 1   ]],
  ],
  laser:[
    [0,   [100, 255, 200, 0   ]],
    [0.1, [120, 255, 220, 0.3 ]],
    [0.3, [150, 255, 240, 0.7 ]],
    [0.55,[180, 255, 255, 0.95]],
    [0.8, [200, 255, 255, 1   ]],
    [1,   [100, 220, 200, 1   ]],
  ],
  vacuum:[
    [0,   [20,  0,   40,  0   ]],
    [0.12,[60,  20,  100, 0.2 ]],
    [0.3, [100, 50,  150, 0.5 ]],
    [0.55,[150, 100, 200, 0.8 ]],
    [0.8, [200, 150, 255, 1   ]],
    [1,   [220, 180, 255, 1   ]],
  ],
};

function getCol(e,r){
  const kf=PAL[e];
  for(let i=1;i<kf.length;i++){
    if(r<=kf[i][0]||i===kf.length-1){
      const lo=kf[i-1],hi=kf[i];
      const f=hi[0]===lo[0]?1:(r-lo[0])/(hi[0]-lo[0]);
      const v=lo[1].map((a,j)=>j<3
        ? Math.round(a+(hi[1][j]-a)*f)
        : +(a+(hi[1][j]-a)*f).toFixed(3)
      );
      return`rgba(${v[0]},${v[1]},${v[2]},${v[3]})`;
    }
  }
  const l=kf[kf.length-1][1];
  return`rgba(${l[0]},${l[1]},${l[2]},${l[3]})`;
}

const GLOW ={fire:'#ff6b3d',water:'#64d5ff',snow:null,earth:null,air:null,spirit:'#d16bff',lightning:'#ffdc57',crystallize:'#64c8ff',bloom:'#ff80c8',laser:'#64ffcc',vacuum:'#9966ff'};
const GMULT={fire:3.5,      water:2.2,      snow:0,    earth:0,   air:0,    spirit:5.5,     lightning:6.2,     crystallize:4.2,    bloom:3.8,    laser:5.5,    vacuum:4.8 };

/* ──────────────────────────────────────────────────────────────────
   PARTICLE
────────────────────────────────────────────────────────────────── */
class P{
  constructor(x,y,e,vx=0,vy=0,chargeSize=1){
    this.x=x;this.y=y;this.e=e;this.chargeSize=chargeSize;
    switch(e){
      case'fire':
        // Burst upward with horizontal chaos
        this.vx=(Math.random()-.5)*6;
        this.vy=-(Math.random()*5+2.5);
        this.ml=50+Math.random()*80;
        this.sz=Math.random()*3.5+.8;
        break;
      case'water':{
        // Falls straight down, minor drift
        this.vx=(Math.random()-.5)*0.4;
        this.vy=0.8+Math.random()*0.3;
        this.ml=200+Math.random()*100;
        this.sz=Math.random()*2+.6;
        this.splash=false;
        break;
      }
      case'snow':{
        // Gentle falling with wind oscillation
        const a=Math.random()*Math.PI*2,s=Math.random()*1.5+.2;
        this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s+0.5;
        this.ml=220+Math.random()*220;
        this.sz=Math.random()*2+.5;
        this.ph=Math.random()*Math.PI*2;
        break;
      }
      case'earth':{
        // Charged projectile - uses chargeSize parameter
        const baseSize=chargeSize*4;
        this.vx=vx;this.vy=vy;
        this.ml=280+Math.random()*120;
        this.sz=baseSize+Math.random()*baseSize*.3;
        this.grav=0.012; // minimal gravity
        break;
      }
      case'air':{
        // Drifting outward
        const a=Math.random()*Math.PI*2,s=Math.random()*3+.5;
        this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
        this.ml=260+Math.random()*280;
        this.sz=Math.random()*2+.4;
        this.rd=Math.random()>.5?1:-1;
        break;
      }
      case'spirit':{
        // Explosive radial burst
        const a=Math.random()*Math.PI*2,s=Math.random()*5.5+2;
        this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
        this.ml=80+Math.random()*115;
        this.sz=Math.random()*4+1.5;
        this.ox=x;this.oy=y;
        break;
      }
      case'lightning':{
        // Fast branching burst
        const a=Math.random()*Math.PI*2,s=Math.random()*8+4;
        this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
        this.ml=35+Math.random()*55;
        this.sz=Math.random()*3.5+1;
        this.branch=0;
        break;
      }
      case'crystallize':{
        // Slow drift, grows over time
        const a=Math.random()*Math.PI*2,s=Math.random()*1.5+.3;
        this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
        this.ml=400+Math.random()*300;
        this.sz=Math.random()*1.5+.4;
        this.growth=.0018;
        this.cluster=Math.random()>.6; // some stick together
        break;
      }
      case'bloom':{
        // Starts tiny, grows huge, explodes
        const a=Math.random()*Math.PI*2,s=Math.random()*2+.5;
        this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
        this.ml=200+Math.random()*150;
        this.sz=0.3;
        this.maxSz=12+Math.random()*8;
        this.growth=0.055;
        this.exploded=false;
        break;
      }
      case'laser':{
        // Large glowing sphere shot at high speed
        this.vx=vx;this.vy=vy;
        this.ml=160+Math.random()*80;
        this.sz=6+Math.random()*3;
        this.grav=0.008; // minimal gravity
        break;
      }
      case'vacuum':{
        // Particles attracted to center of screen
        const a=Math.random()*Math.PI*2,s=Math.random()*3+.5;
        this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
        this.ml=300+Math.random()*200;
        this.sz=Math.random()*2.5+.8;
        this.cx=W/2; // attraction center x
        this.cy=H/2; // attraction center y
        break;
      }
    }
    this.l=this.ml;
  }

  step(){
    switch(this.e){
      case'fire':
        // Chaotic turbulence, natural upward float
        this.vx+=(Math.random()-.5)*.58;
        this.vy-=.09;
        this.vx*=.965;this.vy*=.98;
        break;
      case'water':
        // Falls straight down with slight drift, splashes at bottom
        this.vx+=(Math.random()-.5)*.08;
        this.vy+=.14; // gravity pulling down
        this.vx*=.99;
        
        // Check for splash at ground
        if(!this.splash&&this.y>=H-this.sz*2){
          this.splash=true;
          // Spawn splash particles radiating outward
          for(let i=0;i<6;i++){
            if(parts.length<MAX){
              const ang=(Math.PI*2/6)*i+Math.random()*.3;
              const sp=Math.random()*4+2;
              const sp_part=new P(this.x,this.y,'water',Math.cos(ang)*sp,Math.sin(ang)*sp);
              sp_part.ml=40+Math.random()*40;
              sp_part.isSplash=true;
              parts.push(sp_part);
            }
          }
        }
        if(this.isSplash){
          this.vy*=.96; // slow splash particles
        }
        break;
      case'snow':
        // Wind-blown falling, more delicate than water
        this.vx+=Math.sin(tick*.025+this.ph)*.048;
        this.vy+=.012;
        this.vx*=.995;this.vy*=.997;
        break;
      case'earth':
        // Minimal gravity, projectile motion
        this.vy+=this.grav;
        this.vx*=.998;
        this.vy*=.998;
        break;
      case'air':{
        // Spiral by rotating velocity vector each frame
        const co=Math.cos(.023*this.rd),si=Math.sin(.023*this.rd);
        const nvx=this.vx*co-this.vy*si;
        this.vy=this.vx*si+this.vy*co;
        this.vx=nvx;
        this.vx*=.9986;this.vy*=.9986;
        this.vy-=.007; // barely-there lift
        break;
      }
      case'spirit':
        // Burst outward, pulled home in second half of life
        if(this.l/this.ml<.5){
          this.vx+=(this.ox-this.x)*.006;
          this.vy+=(this.oy-this.y)*.006;
        }
        this.vx*=.96;this.vy*=.96;
        break;
      case'lightning':
        // Branch occasionally, fast decay
        this.vx*=.92;this.vy*=.92;
        this.vy+=.08; // slight gravity
        if(this.branch<2&&Math.random()<.08){
          this.branch++;
          // Create secondary branches
          for(let i=0;i<2;i++){
            if(parts.length<MAX){
              const ang=Math.atan2(this.vy,this.vx)+(Math.random()-.5)*1.2;
              const sp=Math.hypot(this.vx,this.vy)*.6;
              parts.push(new P(this.x,this.y,'lightning',Math.cos(ang)*sp,Math.sin(ang)*sp));
            }
          }
        }
        break;
      case'crystallize':
        // Slow drift with subtle attraction
        this.vx*=.9988;this.vy*=.9988;
        this.vy+=.003; // barely-there gravity
        this.sz+=this.growth; // grow over time
        break;
      case'bloom':
        // Grow and then explode into sparkles
        this.sz+=this.growth;
        this.vx*=.982;this.vy*=.982;
        this.vy+=.04; // slight gravity
        
        // Explode when reaching max size or nearing end of life
        if(!this.exploded&&(this.sz>=this.maxSz||this.l/this.ml<.15)){
          this.exploded=true;
          // Burst into many tiny particles
          for(let i=0;i<20;i++){
            if(parts.length<MAX){
              const ang=Math.random()*Math.PI*2;
              const sp=Math.random()*6+2;
              parts.push(new P(this.x,this.y,'bloom',Math.cos(ang)*sp,Math.sin(ang)*sp,0.2));
            }
          }
        }
        
        // Tiny blooms fade quickly
        if(this.chargeSize<0.5){
          this.l=Math.max(this.l-2,0);
        }
        break;
      case'laser':
        // High-speed projectile with minimal gravity
        this.vy+=this.grav;
        this.vx*=.996;
        this.vy*=.996;
        break;
      case'vacuum':
        // Pulled toward center, gets consumed
        const dx=this.cx-this.x;
        const dy=this.cy-this.y;
        const dist=Math.hypot(dx,dy);
        
        // Gravitational attraction (stronger as you get closer)
        const pull=Math.max(0.005,0.08/(dist*0.005+1));
        this.vx+=(dx/dist)*pull;
        this.vy+=(dy/dist)*pull;
        
        // Friction increases as you approach
        this.vx*=Math.max(0.85,1-pull*0.5);
        this.vy*=Math.max(0.85,1-pull*0.5);
        
        // Consumed at center
        if(dist<20){
          // Create absorption flash
          for(let i=0;i<3;i++){
            if(parts.length<MAX){
              const ang=Math.random()*Math.PI*2;
              const sp=Math.random()*5+3;
              const flash=new P(this.x,this.y,'vacuum',Math.cos(ang)*sp,Math.sin(ang)*sp);
              flash.ml=20+Math.random()*20;
              flash.sz=1;
              parts.push(flash);
            }
          }
          this.l=0; // kill the particle
        }
        break;
    }
    this.x+=this.vx;
    this.y+=this.vy;
    this.l--;
  }

  draw(){
    const r=this.l/this.ml;
    if(r<=0)return;
    const sz=this.sz*Math.min(r*2.8,1);
    if(sz<.18)return;

    // Soft glow halo (cheaper than shadowBlur, looks great)
    const g=GLOW[this.e];
    if(g&&r>.14){
      ctx.globalAlpha=r*.22;
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.arc(this.x,this.y,sz*GMULT[this.e],0,6.283);
      ctx.fill();
    }

    // Core particle
    ctx.globalAlpha=1;
    ctx.fillStyle=getCol(this.e,r);
    ctx.beginPath();
    ctx.arc(this.x,this.y,Math.max(sz,.28),0,6.283);
    ctx.fill();
  }

  get dead(){return this.l<=0}
}

/* ──────────────────────────────────────────────────────────────────
   SPAWN CONFIG
────────────────────────────────────────────────────────────────── */
const SPAWN_N={fire:10,water:8, snow:7, earth:0, air:16,spirit:8, lightning:12, crystallize:6, bloom:5, laser:0 };
const SPAWN_R={fire:9, water:14,snow:12,earth:0, air:20,spirit:13,lightning:16, crystallize:14, bloom:12, laser:0 };

function spawn(x,y,mult=1,dragVx=0,dragVy=0,chargeSize=1){
  const n=Math.ceil(SPAWN_N[el]*mult);
  const r=SPAWN_R[el];
  for(let i=0;i<n&&parts.length<MAX;i++){
    parts.push(new P(
      x+(Math.random()-.5)*r*2,
      y+(Math.random()-.5)*r*2,
      el,
      dragVx,dragVy,
      chargeSize
    ));
  }
}

/* ──────────────────────────────────────────────────────────────────
   RENDER LOOP
────────────────────────────────────────────────────────────────── */
// Fill initial black
ctx.fillStyle='#030508';
ctx.fillRect(0,0,W,H);

function frame(){
  tick++;

  // Trail fade — lower alpha = longer trails
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(3,5,8,.13)';
  ctx.fillRect(0,0,W,H);

  // Draw laser line if active
  if(laserActive&&el==='laser'){
    const grad=ctx.createLinearGradient(laserStart.x,laserStart.y,laserEnd.x,laserEnd.y);
    grad.addColorStop(0,'rgba(100,255,200,0)');
    grad.addColorStop(0.5,'rgba(150,255,240,1)');
    grad.addColorStop(1,'rgba(100,255,200,0)');
    ctx.strokeStyle=grad;
    ctx.lineWidth=8;
    ctx.lineCap='round';
    ctx.globalAlpha=0.8;
    ctx.beginPath();
    ctx.moveTo(laserStart.x,laserStart.y);
    ctx.lineTo(laserEnd.x,laserEnd.y);
    ctx.stroke();
    
    // Glow around laser
    ctx.strokeStyle='rgba(100,255,200,0.4)';
    ctx.lineWidth=20;
    ctx.globalAlpha=0.3;
    ctx.beginPath();
    ctx.moveTo(laserStart.x,laserStart.y);
    ctx.lineTo(laserEnd.x,laserEnd.y);
    ctx.stroke();
  }

  // Update and draw; filter dead particles
  const live=[];
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    p.step();
    if(!p.dead){p.draw();live.push(p)}
  }
  parts=live;

  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ──────────────────────────────────────────────────────────────────
   INPUT
────────────────────────────────────────────────────────────────── */
function move(x,y){
  pmx=mx;pmy=my;
  mx=x;my=y;
  xc.style.left=x+'px';
  xc.style.top=y+'px';
  if(!hinted){hinted=true;hint.style.opacity='0'}
}

function getDragVelocity(){
  const dvx=(mx-pmx)*.12;
  const dvy=(my-pmy)*.12;
  return {dvx,dvy};
}

canvas.addEventListener('mousemove',e=>{
  move(e.clientX,e.clientY);
  if(mdown&&el!=='earth'&&el!=='laser'){
    const {dvx,dvy}=getDragVelocity();
    spawn(e.clientX,e.clientY,1,dvx,dvy);
  }
  if(laserActive){
    laserEnd.x=e.clientX;
    laserEnd.y=e.clientY;
  }
});
canvas.addEventListener('mousedown', e=>{
  mdown=true;
  pmx=e.clientX;pmy=e.clientY;
  if(el==='earth'){
    chargeStart=Date.now();
  }else if(el==='laser'){
    laserActive=true;
    laserStart.x=e.clientX;
    laserStart.y=e.clientY;
    laserEnd.x=e.clientX;
    laserEnd.y=e.clientY;
  }else{
    spawn(e.clientX,e.clientY);
  }
});
canvas.addEventListener('mouseup',  ()=>{
  if(el==='earth'&&chargeStart){
    chargeTime=Date.now()-chargeStart;
    // Charge: 0-500ms = 1 particle small, 500ms-2000ms = 1-2 particles medium, 2000ms+ = 2 particles large
    const chargeVal=Math.min(chargeTime/2000,1);
    const numParticles=chargeTime>500?(Math.random()>.5?2:1):1;
    const size=Math.max(0.5,chargeVal*1.8);
    const {dvx,dvy}=getDragVelocity();
    
    for(let i=0;i<numParticles;i++){
      const ang=Math.atan2(dvy,dvx)+(i===1?(Math.random()-.5)*.4:0);
      const sp=Math.hypot(dvx,dvy)*0.8+Math.random()*2;
      parts.push(new P(mx,my,'earth',Math.cos(ang)*sp,Math.sin(ang)*sp,size));
    }
    chargeStart=0;
  }else if(el==='laser'&&laserActive){
    laserActive=false;
    // Spawn 2 sphere particles along the laser path
    const dx=laserEnd.x-laserStart.x;
    const dy=laserEnd.y-laserStart.y;
    const dist=Math.hypot(dx,dy);
    const angle=Math.atan2(dy,dx);
    const speed=Math.min(dist/100*8,15); // speed based on distance, capped
    
    // Two spheres, offset along the path
    for(let i=0;i<2;i++){
      const offset=i*0.5; // offset along the path
      const vx=Math.cos(angle)*speed;
      const vy=Math.sin(angle)*speed;
      parts.push(new P(
        laserStart.x+dx*offset,
        laserStart.y+dy*offset,
        'laser',
        vx,vy
      ));
    }
  }
  mdown=false;
});
canvas.addEventListener('mouseleave',()=>{
  mdown=false;
  laserActive=false;
});
canvas.addEventListener('dblclick', e=>{
  // Satisfying burst on double-click
  for(let i=0;i<5;i++)spawn(e.clientX,e.clientY,1.6);
});

// Multi-touch support
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  for(let i=0;i<e.touches.length;i++){
    const t=e.touches[i];
    const id=t.identifier;
    activeTouches.set(id,{x:t.clientX,y:t.clientY,px:t.clientX,py:t.clientY});
    if(el==='earth'){
      touchCharges.set(id,Date.now());
    }else if(el==='laser'){
      activeTouches.get(id).laserStart={x:t.clientX,y:t.clientY};
    }else{
      move(t.clientX,t.clientY);
      spawn(t.clientX,t.clientY);
    }
  }
},{passive:false});

canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(let i=0;i<e.touches.length;i++){
    const t=e.touches[i];
    const id=t.identifier;
    if(activeTouches.has(id)&&el!=='earth'&&el!=='laser'){
      const touch=activeTouches.get(id);
      const dvx=(t.clientX-touch.px)*.12;
      const dvy=(t.clientY-touch.py)*.12;
      touch.px=t.clientX;
      touch.py=t.clientY;
      move(t.clientX,t.clientY);
      spawn(t.clientX,t.clientY,1,dvx,dvy);
    }else if(activeTouches.has(id)&&(el==='earth'||el==='laser')){
      const touch=activeTouches.get(id);
      touch.px=t.clientX;
      touch.py=t.clientY;
      move(t.clientX,t.clientY);
      if(el==='laser'){
        laserEnd.x=t.clientX;
        laserEnd.y=t.clientY;
      }
    }
  }
},{passive:false});

canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    const id=e.changedTouches[i].identifier;
    const t=e.changedTouches[i];
    
    if(el==='earth'&&touchCharges.has(id)){
      const chargeTime=Date.now()-touchCharges.get(id);
      const chargeVal=Math.min(chargeTime/2000,1);
      const numParticles=chargeTime>500?(Math.random()>.5?2:1):1;
      const size=Math.max(0.5,chargeVal*1.8);
      const touch=activeTouches.get(id);
      const dvx=(touch.px-touch.x)*.12;
      const dvy=(touch.py-touch.y)*.12;
      
      for(let j=0;j<numParticles;j++){
        const ang=Math.atan2(dvy,dvx)+(j===1?(Math.random()-.5)*.4:0);
        const sp=Math.hypot(dvx,dvy)*0.8+Math.random()*2;
        parts.push(new P(t.clientX,t.clientY,'earth',Math.cos(ang)*sp,Math.sin(ang)*sp,size));
      }
      touchCharges.delete(id);
    }else if(el==='laser'&&activeTouches.has(id)){
      const touch=activeTouches.get(id);
      const laserS=touch.laserStart;
      const dx=t.clientX-laserS.x;
      const dy=t.clientY-laserS.y;
      const dist=Math.hypot(dx,dy);
      const angle=Math.atan2(dy,dx);
      const speed=Math.min(dist/100*8,15);
      
      for(let j=0;j<2;j++){
        const offset=j*0.5;
        const vx=Math.cos(angle)*speed;
        const vy=Math.sin(angle)*speed;
        parts.push(new P(
          laserS.x+dx*offset,
          laserS.y+dy*offset,
          'laser',
          vx,vy
        ));
      }
    }
    
    activeTouches.delete(id);
  }
},{passive:false});

canvas.addEventListener('touchcancel', e=>{
  touchCharges.clear();
  activeTouches.clear();
});

/* ──────────────────────────────────────────────────────────────────
   UI
────────────────────────────────────────────────────────────────── */
const GLC={
  fire:'#ff6b3d',water:'#3da5ff',
  snow:'#b4d8ff',earth:'#dca078',air:'#ffd966',spirit:'#d16bff',lightning:'#ffdc57',crystallize:'#64c8ff',bloom:'#ff64c8',laser:'#64ffcc'
};

function setEl(name){
  document.querySelectorAll('.eb').forEach(b=>b.classList.remove('on'));
  document.querySelector(`.eb[data-e="${name}"]`).classList.add('on');
  el=name;
  xc.style.borderColor=GLC[el];
  xc.style.boxShadow=`0 0 9px ${GLC[el]}aa`;
}

document.querySelectorAll('.eb').forEach(b=>{
  b.addEventListener('click',()=>setEl(b.dataset.e));
});

function clearCanvas(){
  parts=[];
  ctx.fillStyle='#030508';
  ctx.fillRect(0,0,W,H);
}
document.getElementById('bclear').addEventListener('click',clearCanvas);

// Keyboard shortcuts
const KEYS={
  Digit0:'laser',Digit1:'fire',Digit2:'water',Digit3:'snow',Digit4:'earth',Digit5:'air',Digit6:'spirit',Digit7:'lightning',Digit8:'crystallize',Digit9:'bloom',
};
addEventListener('keydown',e=>{
  if(KEYS[e.code])setEl(KEYS[e.code]);
  if(e.code==='KeyC'&&!e.ctrlKey)clearCanvas();
});

}();
</script>
